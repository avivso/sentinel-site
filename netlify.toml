# generated by sentinel.dashboard.publish - do not hand-edit
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

# MCP OAUTH PROXY - AND THIS FILE IS REGENERATED ON EVERY BUILD, so these rules
# have to live HERE rather than in the deployed copy. Editing the deployed
# netlify.toml by hand worked for exactly one deploy and the next republish
# would have silently removed it, breaking the connector with nothing to say so.
#
# WHY IT IS NEEDED: OAuth's authorize step is INTERACTIVE - claude.ai reads
# .well-known and sends the OPERATOR'S BROWSER to authorization_endpoint. The
# VM's TLS is intercepted from that network (d119), so registration succeeded
# server-to-server while the browser redirect timed out, and the flow died with
# a registered client that could never be authorized. Netlify's edge is not
# behind that ISP.
#
# status = 200 is a PROXY (rewrite), not a redirect. A 3xx would hand the
# browser back the blocked hostname and change nothing.
[[redirects]]
  from = "/.well-known/*"
  to = "https://sentinel.151.145.84.228.sslip.io/.well-known/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/authorize"
  to = "https://sentinel.151.145.84.228.sslip.io/authorize"
  status = 200
  force = true

[[redirects]]
  from = "/register"
  to = "https://sentinel.151.145.84.228.sslip.io/register"
  status = 200
  force = true

[[redirects]]
  from = "/token"
  to = "https://sentinel.151.145.84.228.sslip.io/token"
  status = 200
  force = true

[[redirects]]
  from = "/revoke"
  to = "https://sentinel.151.145.84.228.sslip.io/revoke"
  status = 200
  force = true

[[redirects]]
  from = "/mcp"
  to = "https://sentinel.151.145.84.228.sslip.io/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/mcp/*"
  to = "https://sentinel.151.145.84.228.sslip.io/mcp/:splat"
  status = 200
  force = true
